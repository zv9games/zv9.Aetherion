[workspace]
resolver = "2"
members = [
    "crates/aetherion",
    "crates/aetherion-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zv9games/aetherion"
rust-version = "1.87"

[workspace.dependencies]
aetherion = { path = "crates/aetherion" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
rayon = "1.10"
