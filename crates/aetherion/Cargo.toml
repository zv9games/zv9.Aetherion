[package]
name = "aetherion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Aetherion procedural generation core (optional Godot 4 GDExtension)"
readme = "../../README.md"

[lib]
name = "aetherion"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Enable Godot 4 GDExtension bindings (requires godot-rust).
godot = ["dep:godot"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Align with SSXL-ext ashes (Godot 4.2–4.5 class of API).
godot = { version = "0.4.5", optional = true }
