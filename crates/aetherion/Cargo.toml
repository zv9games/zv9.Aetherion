[package]
name = "aetherion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "2D procedural generation for Godot 4 (optional GDExtension) — Rust owns gen, Godot owns presentation"
readme = "../../README.md"
keywords = ["godot", "gdextension", "procedural", "2d", "game"]
categories = ["game-development", "graphics"]
exclude = ["/target/", "**/*.dll", "**/*.so", "**/*.dylib"]

[lib]
name = "aetherion"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Enable Godot 4 GDExtension bindings (requires godot-rust).
godot = ["dep:godot"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
rayon = "1.10"
# Align with SSXL-ext ashes (Godot 4.2–4.5 class of API).
godot = { version = "0.4.5", optional = true }
