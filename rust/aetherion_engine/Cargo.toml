[package]
name = "aetherion_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "aetherion_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
aetherion_core = { path = "../aetherion_core" }
aetherion_shared = { path = "../aetherion_shared" }
aetherion_trailkeeper = { path = "../aetherion_trailkeeper" }


# Godot bindings
godot = { path = "../../../zv9.gdext/godot" }
godot-core = { path = "../../../zv9.gdext/godot-core" }
godot-macros = { path = "../../../zv9.gdext/godot-macros" }

# Shared utilities
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
once_cell = "1.21"
rand = "0.9.2"
serde_json = "1.0.145"
chrono = "0.4.42"

[features]
macros = []
