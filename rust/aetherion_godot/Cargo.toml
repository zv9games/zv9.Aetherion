# aetherion_godot/Cargo.toml

[package]
name = "aetherion_godot"
version = "0.6.0"
edition = "2021"

[dependencies]
# --- INTERNAL DEPENDENCIES ---
aetherion_engine_ffi = { path = "../aetherion_engine_ffi" }
aetherion_shared = { path = "../aetherion_shared" }
aetherion_math = { path = "../aetherion_math" }
aetherion_generate = { path = "../aetherion_generate" }

# --- EXTERNAL DEPENDENCIES ---

# CORE GDExtension BINDINGS
godot = { workspace = true }

# Workspace standard logging framework
tracing = { workspace = true }
tokio = { workspace = true }

###############################################################
# REQUIRED FIX FOR GDExtension LINKER ERROR (E0127)
###############################################################
[lib]
crate-type = ["cdylib"]
name = "aetherion_engine"
# The name "aetherion_engine" forces the creation of 
# 'aetherion_engine.dll' in the target directory,
# which Godot expects to find via the .gdextension file.