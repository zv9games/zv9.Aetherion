[package]
name = "aetherion_engine_ffi"
version = "0.6.0"
edition = "2021"

[lib]
name = "aetherion_engine"
# Required for generating the dynamic library (.dll/.so) needed for Godot GDExtension, 
# and a standard Rust library (.rlib).
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- INTERNAL DEPENDENCIES (Core Logic) ---
# FFI needs access to all the core data and logic it is bridging.
aetherion_shared   = { path = "../aetherion_shared" }
aetherion_generate = { path = "../aetherion_generate" }
aetherion_sync     = { path = "../aetherion_sync" }
aetherion_cache    = { path = "../aetherion_cache" }
aetherion_math     = { path = "../aetherion_math" }

# --- EXTERNAL DEPENDENCIES ---
# The standard C library definitions for safe FFI (e.g., c_char, c_void)
libc               = "0.2" 
# Workspace standard logging framework
tracing            = { workspace = true } 
