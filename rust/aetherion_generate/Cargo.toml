[package]
name = "aetherion_generate"
version = "0.6.0"
edition = "2021"

[dependencies]
# --- INTERNAL DEPENDENCIES (Foundation Layer) ---
aetherion_shared = { path = "../aetherion_shared" }
aetherion_math   = { path = "../aetherion_math" }
aetherion_sync   = { path = "../aetherion_sync" }
aetherion_tools = { path = "../aetherion_tools" }
aetherion_cache = { path = "../aetherion_cache" }

# --- EXTERNAL DEPENDENCIES (Core Computation) ---
# For parallel execution of generation algorithms
rayon            = { workspace = true }
# Core randomness library
rand             = { workspace = true }
# Used for saving/loading bitmap images (optional textures/noise visualizations)
image            = { workspace = true }
# Ensure we use the workspace's standard logging framework
tracing          = { workspace = true }
tokio            = { workspace = true }
noise            = { workspace = true }
glam             = { workspace = true }