[package]
name = "aetherion_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core utilities
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
env_logger = "0.10"
regex = "1.11"
lazy_static = "1.5"
once_cell = "1.21"
chrono = "0.4"
sha2 = "0.10"
aetherion_shared = { path = "../aetherion_shared" }

# Concurrency and math
crossbeam-channel = "0.5"
crossbeam = "0.8"
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }
glam = "0.30"
thiserror = "1.0"

# File and terminal
walkdir = "2.4"
crossterm = "0.27"
notify = "8.2"
notify-debouncer-mini = "0.7"

# JSON
serde_json = "1.0"
image = "0.25.8"

