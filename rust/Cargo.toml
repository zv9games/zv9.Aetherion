[workspace]
members = [
    "aetherion_shared",
    "aetherion_math",
    "aetherion_sync",
    "aetherion_generate",
    "aetherion_cache",
    "aetherion_engine_ffi",
    "aetherion_godot",
    "aetherion_tools",
    "aetherion_cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }

# Tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Time & Random
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_pcg = "0.9"

# Parsing & Utils
nom = "7.1"
regex = "1.11"
once_cell = "1.19"

# Concurrency
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync"] }
rayon = "1.10"
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Math & Graphics
glam = "0.28"
sha2 = "0.10"
image = "0.24"
noise = "0.9"

# Godot & CLI
godot = { version = "0.4.5", features = ["serde"] }
crossterm = "0.27"
walkdir = "2.5"
ctrlc = "3.4"
serde-big-array = "0.5.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_variables = "warn"
dead_code = "warn"