[workspace]
members = [
    # 1. Foundation Layer (Core Data & Primitives)
    "aetherion_shared",
    "aetherion_math",
    "aetherion_sync",

    # 2. Processing Layer (Computation & Persistence)
    "aetherion_generate",
    "aetherion_cache",

    # 3. Interface Layer (External Bridges)
    "aetherion_engine_ffi",
    "aetherion_godot",

    # 4. Tooling & Execution Layer
    "aetherion_tools",
    "aetherion_cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# ------------------------------------------------------------------
# CORE UTILITIES
# ------------------------------------------------------------------
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
bincode           = "1.3"
log               = "0.4"
env_logger        = "0.11"
thiserror         = "1.0"
anyhow            = "1.0" 
tracing           = "0.1" # Core tracing library
tracing-subscriber = "0.3" # Used to manage and output tracing data
uuid              = { version = "1.8", features = ["v4", "fast-rng"] } # v4 is random, fast-rng is efficient

# ------------------------------------------------------------------
# TIME, RANDOMNESS, AND PARSING
# ------------------------------------------------------------------
chrono            = { version = "0.4", features = ["serde"] } 
rand              = { version = "0.8", features = ["small_rng"] }
rand_pcg          = "0.9"
nom               = "7.1"
regex             = "1.11"
once_cell         = "1.19"
lazy_static       = "1.5"

# ------------------------------------------------------------------
# CONCURRENCY AND MATH
# ------------------------------------------------------------------
tokio             = { version = "1.35", features = ["rt-multi-thread"] }
rayon             = "1.10"
crossbeam         = "0.8"
crossbeam-channel = "0.5"
parking_lot       = "0.12" 
glam              = "0.25"
sha2              = "0.10"
image             = "0.24"

# ------------------------------------------------------------------
# CLI AND CONSOLE UTILITIES
# ------------------------------------------------------------------
crossterm         = "0.27" # Added for interactive console menu in aetherion_cli
walkdir           = "2.5"  # Added (assuming you need a version for the module tree feature)

[workspace.lints.rust]
unsafe_code      = "deny"
unused_variables = "warn"
dead_code        = "warn"

[workspace.features]
default   = []
profile   = []
parallel  = []
fast_rng  = []